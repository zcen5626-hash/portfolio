<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self Check - Road Defect Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="self-check">
  <div class="check-page">
    <div class="check-box">
      <h1>Front-end Self Check</h1>
      <p>
        This page runs the four built-in checks: view-state derivation, event merging,
        trend point appending and preference persistence. Open it in a browser and read
        the result below.
      </p>
      <p id="check-result">Running checks…</p>
      <!-- 自检会实际调用 drawTrend()，需要一个 canvas 作为落点（隐藏即可） -->
      <canvas id="trend-canvas" style="display:none"></canvas>
    </div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
